name: Rappels de publication

# Envoie une notif ntfy 1 fois par heure, de 7h à 23h (heure de Paris), avec le
# prochain clip à poster. Tourne dans le cloud (indépendant de ton PC).
#
# On se réveille toutes les 15 min toute la journée (dépôt public = minutes
# GitHub illimitées). post.py décide de l'heure de Paris et n'envoie qu'UN
# rappel par heure d'horloge -> robuste aux changements d'heure été/hiver et
# aux réveils sautés/retardés par GitHub.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:      # bouton "Run workflow" pour tester à la main
    inputs:
      test:
        description: "Envoyer une notif de test au lieu d'un vrai rappel"
        type: boolean
        default: false

# Un seul run à la fois (évite les envois en double).
concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write   # pour réenregistrer data/publish_queue.json entre les runs

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Envoyer le rappel du créneau
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then
            python post.py --test
          else
            python post.py
          fi

      - name: Sauvegarder la file (si changée)
        run: |
          if [ -n "$(git status --porcelain data/publish_queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/publish_queue.json
            git commit -m "maj file de publication"
            git push
          else
            echo "Aucun changement de file."
          fi
